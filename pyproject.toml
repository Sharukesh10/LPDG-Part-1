[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gateway_priority"
version = "0.1.0"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pyarrow>=15.0.0",
    "openpyxl>=3.1.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
